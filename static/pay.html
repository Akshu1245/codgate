<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0c0d0b" />
  <title>Prepaid to ship · CodGate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0c0d0b;--surface:#151611;--elevated:#1c1e17;--fg:#eceae3;--muted:#9a978c;--subtle:#6e6c64;--border:#2a2c24;--accent:#e8e4d8;--accent-fg:#0c0d0b;--allow:#8fad86;--force:#d4b896;--stop:#c17a6a}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif}.wrap{width:min(100% - 32px,760px);margin:auto}header{border-bottom:1px solid var(--border)}.topline{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid var(--border);font:500 9px/1.3 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--subtle)}.brand{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:16px 0 14px}.brand h1{font:400 30px/.95 "Instrument Serif",Georgia,serif;letter-spacing:-.02em;margin:0}.brand span{font:400 10px/1.4 "IBM Plex Mono",monospace;color:var(--muted)}main{padding:54px 0 70px}.slip{width:min(100%,520px);margin:0 auto;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.slip-head{display:flex;justify-content:space-between;gap:18px;align-items:end;padding:14px 0;border-bottom:1px solid var(--border)}.kicker{font:500 9px/1.35 "IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--subtle)}h2{font:400 37px/.98 "Instrument Serif",Georgia,serif;letter-spacing:-.025em;margin:4px 0 0}.id{max-width:210px;text-align:right;word-break:break-all;color:var(--subtle);font:400 9px/1.5 "IBM Plex Mono",monospace}.content{padding:28px 0}.amount{font:400 58px/.9 "Instrument Serif",Georgia,serif;letter-spacing:-.03em;margin:12px 0 18px}.muted{color:var(--muted);font-size:12px;line-height:1.55}.btn{min-height:48px;width:100%;border:1px solid var(--force);border-radius:8px;background:var(--force);color:var(--accent-fg);font-weight:600;margin-top:22px;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.paid{border-top:1px solid var(--border);border-bottom:1px solid var(--border);color:var(--allow);padding:13px 0;margin-top:18px;font:500 11px/1.45 "IBM Plex Mono",monospace}.back{min-height:44px;display:inline-flex;align-items:center;color:var(--muted);font:500 10px/1.4 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.09em;text-decoration:none;margin-top:14px}.back:hover{color:var(--fg)}@media(max-width:560px){main{padding-top:34px}.topline span:last-child{display:none}.brand{align-items:flex-start;flex-direction:column;gap:4px}.slip-head{align-items:flex-start;flex-direction:column}.id{text-align:left;max-width:100%}.amount{font-size:50px}}
  </style>
</head>
<body>
<header><div class="wrap"><div class="topline"><span>CodGate / prepaid instruction</span><span>COD blocked by policy v1.0</span></div><div class="brand"><h1>Prepaid to ship</h1><span>Payment Link desk</span></div></div></header>
<main class="wrap"><section class="slip"><div class="slip-head"><div><div class="kicker">Collection slip</div><h2>Amount due</h2></div><div class="id" id="id"></div></div><div class="content" id="content"><p class="muted">Reading this link from localStorage…</p></div></section><a class="back" href="/">← Back to gate</a></main>
<script>
  const id=decodeURIComponent(location.pathname.split("/").pop()||"");document.getElementById("id").textContent=id;
  const key=`codgate:plink:${id}`;let link=null;try{link=JSON.parse(localStorage.getItem(key)||"null")}catch(e){}
  const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");const content=document.getElementById("content");
  async function state(){try{const r=await fetch(`/payment-links/${encodeURIComponent(id)}`);return await r.json()}catch(e){return {paid:Boolean(link?.paid)}}}
  async function render(){const s=await state();if(!link){content.innerHTML=`<div class="amount">—</div><p class="muted">The id still looks simulated, but this link is not stored on this device. Nothing will be charged. Score the order again from Gate.</p>`;return;}if(s.paid||link.paid){content.innerHTML=`<p class="muted">${link.customer_name?link.customer_name+" · ":""}${link.order_id}</p><div class="amount">${money(link.amount)}</div><div class="paid">PAYMENT RECORDED · COD WILL NOT BE COLLECTED</div>`;return;}content.innerHTML=`<p class="muted">${link.customer_name?link.customer_name+" · ":""}${link.order_id}</p><div class="amount">${money(link.amount)}</div><p class="muted">COD was blocked. This is <span style="font-family:'IBM Plex Mono',monospace">plink_SIMULATED</span>; nothing is charged unless a Razorpay test link was issued from the Gate.</p><button class="btn" id="pay" type="button">Pay ${money(link.amount)}</button>`;document.getElementById("pay").addEventListener("click",async()=>{const r=await fetch(`/payment-links/${encodeURIComponent(id)}/paid`,{method:"POST"});if(r.ok){link.paid=true;localStorage.setItem(key,JSON.stringify(link));render()}})}
  render();
</script>
</body>
</html>
