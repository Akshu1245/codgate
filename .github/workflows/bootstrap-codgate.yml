name: finalize-codgate
permissions:
  contents: write
on:
  push:
    paths:
      - 'bootstrap/chunk*.txt'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install final CodGate source
        run: |
          cp .github/workflows/test.yml /tmp/test.yml
          cat bootstrap/chunk0.txt bootstrap/chunk1.txt bootstrap/chunk2.txt bootstrap/chunk3.txt bootstrap/chunk4.txt | base64 -d > /tmp/codgate.tar.gz
          tar -xzf /tmp/codgate.tar.gz -C .
          mv /tmp/test.yml .github/workflows/test.yml
          rm -f bootstrap/chunk*.txt bootstrap/codgate-text.tar.gz
          rmdir bootstrap 2>/dev/null || true
      - name: Publish final class repo
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Ship final CodGate AI Risk Manager"
          git push
