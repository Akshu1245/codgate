name: codgate-ui-refresh
on:
  push:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install redesigned desk UI
        run: |
          unzip -o .codgate-ui.zip -d static
          rm .codgate-ui.zip .github/workflows/ui-publish.yml
      - name: Commit redesigned UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine CodGate clearing-house UI"
          git push
